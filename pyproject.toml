[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rdk-s100-patrol-final"
version = "1.0.0"
description = "Unified RDK S100 patrol detection runtime"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "opencv-contrib-python-headless>=4.8",
  "Pillow>=9.0",
  "PyYAML>=6.0",
]

[project.scripts]
rdk-patrol = "rdk_patrol.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
